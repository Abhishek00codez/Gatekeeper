version: '3.8'

services:
  gatekeeper:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOWNSTREAM_BASE_URL=http://downstream:4000
      - RATE_LIMIT_CAPACITY=1000
      - RATE_LIMIT_REFILL_RATE=100
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  downstream:
    image: nginx:alpine
    ports:
      - "4000:80"
